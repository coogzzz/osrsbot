  timeout_sec: 2.0

strategy:
  trend_window: 1440
  transaction_tax_pct: 1.0
  nudge_offset_pct: 1.0
  break_even_margin_pct: 3.0
  max_active_orders: 4
  min_profit_margin_pct: 3.0

analyzer:
  sma_period: 1440
  buy_threshold_sma_pct: 2.5
  max_position_value_gp: 1300000

kinematics:
